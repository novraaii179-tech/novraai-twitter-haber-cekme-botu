name: Twitter Firestore Haber Botu

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  scrape_and_save:
    runs-on: ubuntu-latest
    steps:
      - name: Depo Kodunu Al
        uses: actions/checkout@v4

      - name: Python 3.11 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Paketleri Yükle
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Botu Çalıştır
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
        run: |
          python bot.py
