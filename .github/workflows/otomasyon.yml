name: Novra AI - Twitter Haber Botu ve Otomatik Temizleme

on:
  schedule:
    # Her 30 dakikada bir otomatik çalışır
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      list_url:
        description: 'Özel bir liste URL veya ID ile çalıştırmak için girin (isteğe bağlı)'
        required: false
        default: ''
      cleanup_only:
        description: 'Sadece 2 günden eski haberleri temizle (true/false)'
        type: boolean
        default: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Gerekli Bağımlılıkları ve Chromium'u Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Haber Botunu Çalıştır
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          TWITTER_COOKIES: ${{ secrets.TWITTER_COOKIES }}
          TWITTER_LISTS: ${{ secrets.TWITTER_LISTS || vars.TWITTER_LISTS }}
          RETENTION_DAYS: ${{ vars.RETENTION_DAYS || '2' }}
          SAVE_MODE: ${{ vars.SAVE_MODE || 'both' }}
        run: |
          if [ "${{ github.event.inputs.cleanup_only }}" = "true" ]; then
            python bot.py --cleanup-only
          elif [ -n "${{ github.event.inputs.list_url }}" ]; then
            python bot.py --list "${{ github.event.inputs.list_url }}"
          else
            python bot.py
          fi
